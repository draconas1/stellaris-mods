 ccs_events.100.name: "Future of §Y$CYBERCREED_labor$§!"
 ccs_events.100.desc: "§Y$CYBERCREED_labor$§! is the first of the Creeds to question its purpose in the new galaxy.\n\nAll of their debates come down to one fundamental question: §YIs toil liberation or penance?§!"
 ccs_events.100.authoritarian: "Toil is the penance of the lesser peoples"
 ccs_events.100.authoritarian.tooltip: "§Y$CYBERCREED_labor$§! will become §Y$ethic_authoritarian$§!"
 ccs_events.100.egalitarian: "To toil is liberation for the betterment of all"
 ccs_events.100.egalitarian.tooltip: "§Y$CYBERCREED_labor$§! will become §Y$ethic_egalitarian$§!"

 ccs_events.200.name: "Future of §Y$CYBERCREED_war$§!"
 ccs_events.200.desc: "Nobody doubts the prowess and commitment to battle of §Y$CYBERCREED_war$§!\n\n Our people instead question war itself.  Do we believe that §Ywar is a last resort for the protection of our way of life or is conquest the divine right of our people?§!"
 ccs_events.200.militarist: "War is a dish served frequently and often"
 ccs_events.200.militarist.tooltip: "§Y$CYBERCREED_war$§! will become §Y$ethic_militarist$§!"
 ccs_events.200.pacifist: "War is the last resort to defend our people"
 ccs_events.200.pacifist.tooltip: "§Y$CYBERCREED_war$§! will become §Y$ethic_pacifist$§!"

 ccs_events.300.name: "Future of §Y$CYBERCREED_construction$§!"
 ccs_events.300.desc: "§Y$CYBERCREED_construction$§! do not debate their place within our society, but the place of others.\n\nIn a galaxy filled with life, §Ywhat shall we do with other species?§!"
 ccs_events.300.xenophobe: "§Y[This.Owner.GetName]§! is an empire of §Y[This.Owner.GetSpeciesNamePlural]§!"
 ccs_events.300.xenophobe.tooltip: "§Y$CYBERCREED_construction$§! will become §Y$ethic_xenophobe$§!"
 ccs_events.300.xenophile: "All are welcome within §Y[This.Owner.GetName]§!"
 ccs_events.300.xenophile.tooltip: "§Y$CYBERCREED_construction$§! will become §Y$ethic_xenophile$§!"

 ccs_events.400.name: "Future of §Y$CYBERCREED_research$§!"
 ccs_events.400.desc: "Of all the creeds §Y$CYBERCREED_research$§! have long been the most internally fractious, issue of the divide between the material and the scientific against the spiritual and unknowable being daily arguments.  So it is perhaps not surprising that they have settled best into how they will go forward in many respects, but one final question has them deadlocked.\n\nWith the emergency of sentient or near sentient artificial intelligence seeming a technological certainty: §YDoes artificial life have a soul?§!"
 ccs_events.400.robots: "Souls are an innate property of all life"
 ccs_events.400.robots.tooltip: "§Y$CYBERCREED_research$§! will have §Y$ethic_materialist$§! demands"
 ccs_events.400.norobots: "Make not a machine that thinks like a person"
 ccs_events.400.norobots.tooltip: "§Y$CYBERCREED_research$§! will have §Y$ethic_spiritualist$§! demands"

