l_english:
 machine_age.1010.ccs: "The Galaxy is large enough for All Creeds"
 machine_age.1010.ccs.tooltip: "We will go forward as individual Creeds who will learn to work together\nCreed buildings will remain on the capital.\nNew colonies can be dedicated to a single creed or to all\nThe creeds will remain as §YFactions§! and will shift ethos from purely §YSpiritualist§!."

 machine_age.1020.desc.ccs: "The Great Synod of the Creeds has been agreed\nIt has taken a lot of arguing, and just because they have all agreed that the galaxy is big enough for everyone, doesn't mean that they are happy about sharing it.\n\nOur capital is, and always will be, a bastion of the faith where all creeds can come.\nAny other planet will either be dedicated to a single creed - allowing only that creeds temple, or to all creeds, that will allow multiple temples.  The creeds have also greed to a $building_the_united_sanctum_of_augmentation$ that is all creeds and none.\n\nYou can expect the creeds to jostle for the largest number of dedicated planets, and having multiple creeds on a single planet is likely to cause issues with stability and efficiency.  Just because they have agreed to share in theory, doesn't mean they enjoy working with each other in practice.\n\nThe Creeds will now have to figure out their exact place in our new order"
 machine_age.1020.ccs.tooltip: "Expect questions later as the Creeds begin a phase of introspection"

